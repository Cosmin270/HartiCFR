databases:
  - name: harticfr-db
    databaseName: harticfr
    user: harticfr
    plan: free
    region: frankfurt

services:
  # .NET API. Schema migrations run on boot, so a fresh database comes up ready.
  - type: web
    name: harticfr-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: HartiCFR_BE
    # Resolved relative to rootDir.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: harticfr-db
          property: connectionString
      # Must match the frontend's public URL exactly, or cookie auth will fail CORS.
      - key: Cors__AllowedOrigins
        value: https://harticfr.onrender.com

  # React SPA served as static files.
  - type: web
    name: harticfr
    runtime: static
    rootDir: HartiCFR_FE
    # Render provisions pnpm itself (from the packageManager field) and installs
    # dependencies before this runs; installing pnpm globally hits a read-only
    # /usr/lib/node_modules.
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    routes:
      # Proxy the API under this site's own origin. Calling the API on its own
      # subdomain makes the auth cookie third-party -- onrender.com is a public
      # suffix, so the two services are separate sites -- and Safari blocks
      # third-party cookies outright, which silently breaks login. Must come
      # before the SPA fallback below.
      - type: rewrite
        source: /api/*
        destination: https://harticfr-api.onrender.com/api/*
      # Client-side routing: everything that is not a real file falls back to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
