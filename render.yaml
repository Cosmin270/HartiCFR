databases:
  - name: harticfr-db
    databaseName: harticfr
    user: harticfr
    plan: free
    region: frankfurt

services:
  # .NET API. Schema migrations run on boot, so a fresh database comes up ready.
  - type: web
    name: harticfr-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: HartiCFR_BE
    # Resolved relative to rootDir.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: harticfr-db
          property: connectionString
      # Must match the frontend's public URL exactly, or cookie auth will fail CORS.
      - key: Cors__AllowedOrigins
        value: https://harticfr.onrender.com

  # React SPA served as static files.
  - type: web
    name: harticfr
    runtime: static
    rootDir: HartiCFR_FE
    # Render provisions pnpm itself (from the packageManager field) and installs
    # dependencies before this runs; installing pnpm globally hits a read-only
    # /usr/lib/node_modules.
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    envVars:
      # Baked into the bundle at build time. Must match the API service's real
      # URL -- if Render assigns a different name, update this and redeploy.
      - key: VITE_API_URL
        value: https://harticfr-api.onrender.com
    routes:
      # Client-side routing: everything that is not a real file falls back to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
