<!doctype html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="Harta trecerilor la nivel cu instalații de semnalizare și a stațiilor CFR din România." />
  <title>Harti CFR — treceri la nivel și stații</title>
  <!-- Pick the colour theme before the first paint; mirrors src/lib/theme.ts. -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("harticfr:theme"); } catch (e) {}
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
